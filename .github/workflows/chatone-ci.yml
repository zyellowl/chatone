name: ChatOne checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  custom-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify ChatOne customizations
        run: npm run test:chatone
      - name: Reject upstream maintainer automations
        shell: bash
        run: |
          forbidden_workflows=(
            client.yml
            data-provider.yml
            data-schemas.yml
            deploy-dev.yml
            dev-branch-images.yml
            dev-images.yml
            generate_embeddings.yml
            gitnexus-cleanup-pr.yml
            gitnexus-deploy.yml
            gitnexus-index.yml
            gitnexus-pr-command.yml
            helmcharts.yml
            locize-i18n-sync.yml
            retry-docker-builds.yml
            sync-helm-chart-tags.yml
            tag-images.yml
          )

          for workflow in "${forbidden_workflows[@]}"; do
            if [ -e ".github/workflows/$workflow" ]; then
              echo "::error::.github/workflows/$workflow is upstream maintainer automation and must stay disabled"
              exit 1
            fi
          done
      - name: Reject committed local secrets and private data
        shell: bash
        run: |
          test ! -f .env
          test ! -f auth.json
          ! git ls-files | grep -E '(^|/)(uploads|dist|logs)/|openai\.json$|\.archive$'
      - name: Reject obsolete product branding
        shell: bash
        run: |
          ! git grep -I -E 'Personal AI|personal-ai|PersonalAI|personal_ai' -- \
            ':!custom/codex-bridge/install-launch-agent.sh' \
            ':!custom/codex-bridge/uninstall-launch-agent.sh' \
            ':!custom/macos/Info.plist' \
            ':!.github/workflows/chatone-ci.yml'
