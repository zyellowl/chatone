          - 'openai/gpt-5.5'
          - 'openai/gpt-5.5-pro'
          - 'openai/gpt-5.6-luna'
          - 'openai/gpt-5.6-sol'
          - 'openai/gpt-5.6-terra'
          - 'qwen/qwen3-coder-plus'
          - 'qwen/qwen3-max'
          - 'qwen/qwen3.5-flash'
          - 'qwen/qwen3.5-plus'
          - 'qwen/qwen3.6-flash'
          - 'qwen/qwen3.6-max-preview'
          - 'qwen/qwen3.6-plus'
          - 'qwen/qwen3.7-flash'
          - 'qwen/qwen3.7-max'
          - 'qwen/qwen3.7-plus'
          - 'qwen/qwen3.8-2.4t-a95b'
          - 'qwen/qwen3.8-27b'
          - 'qwen/qwen3.8-max'
          - 'sapiens-ai/agnes-2.0-flash'
          - 'sapiens-ai/agnes-2.5-flash'
          - 'sapiens-ai/agnes-2.5-pro'
          - 'stepfun/step-3.5-flash'
          - 'stepfun/step-3.7-flash'
          - 'tencent/hy3'
          - 'tencent/hy3-preview'
          - 'x-ai/grok-4.2-fast'
          - 'x-ai/grok-4.2-fast-non-reasoning'
          - 'x-ai/grok-4.3'
          - 'x-ai/grok-4.5'
          - 'x-ai/grok-4.6'
          - 'x-ai/grok-build-0.1'
          - 'xiaomi/mimo-v2.5'
          - 'xiaomi/mimo-v2.5-pro'
          - 'z-ai/glm-4.5'
          - 'z-ai/glm-4.5-air'
          - 'z-ai/glm-4.6'
          - 'z-ai/glm-4.6v'
          - 'z-ai/glm-4.6v-flash'
          - 'z-ai/glm-4.6v-flash-free'
          - 'z-ai/glm-4.7'
          - 'z-ai/glm-4.7-flash-free'
          - 'z-ai/glm-4.7-flashx'
          - 'z-ai/glm-5'
          - 'z-ai/glm-5-turbo'
          - 'z-ai/glm-5.1'
          - 'z-ai/glm-5.2'
          - 'z-ai/glm-5.3'
          - 'z-ai/glm-5v-turbo'
          # zenmux-catalog:end
        fetch: false
      titleConvo: true
      titleModel: openai/gpt-5.6-luna
      titleMethod: completion
      titleMessageRole: user
      modelDisplayLabel: ZenMux
      # LibreChat does not yet know ZenMux's provider-prefixed model IDs.
      # Supplying the favorite models' current metadata prevents the generic
      # 1K context fallback and also keeps local usage estimates meaningful.
      tokenConfig:
        'anthropic/claude-sonnet-5':
          prompt: 2
          completion: 10
          context: 1000000
          cacheRead: 0.2
          cacheWrite: 2.5
        'anthropic/claude-opus-5':
          prompt: 5
          completion: 25
          context: 1000000
          cacheRead: 0.5
          cacheWrite: 6.25
        'google/gemini-3.1-pro-preview':
          prompt: 2
          completion: 12
          context: 1048576
          cacheRead: 0.2
          cacheWrite: 4.5
        'openai/gpt-5.6-sol':
          prompt: 5
          completion: 30
          context: 1050000
          cacheRead: 0.5
          cacheWrite: 6.25
      customParams:
        defaultParamsEndpoint: anthropic
        # ZenMux implements Anthropic's native server-side Web Search tool.
        # Keep the tool available by default and let the selected model decide
        # whether a prompt needs live information. Users can still turn it off
        # per conversation from the Parameters panel.
        paramDefinitions:
          - key: web_search
            label: com_ui_web_search
            labelCode: true
            description: com_endpoint_anthropic_use_web_search
            descriptionCode: true
            type: boolean
            default: true
            component: switch
            optionType: conversation
            showDefault: false
            columnSpan: 2
    - name: ChatGPT Subscription
      apiKey: 'local-chatgpt-subscription'
      baseURL: 'http://host.docker.internal:4317/v1'
      models:
        default:
          - 'gpt-5.6-sol'
          - 'gpt-5.6-terra'
          - 'gpt-5.6-luna'
          - 'gpt-5.5'
          - 'gpt-5.4'
          - 'gpt-5.4-mini'
          - 'gpt-5.3-codex-spark'
        fetch: true
      titleConvo: true
      titleModel: 'gpt-5.6-luna'
      titleMethod: completion
      titleMessageRole: user
      modelDisplayLabel: 'ChatGPT Subscription'
      dropParams:
        - frequency_penalty
        - presence_penalty
