          - 'meituan/longcat-2.0'
          - 'meta/muse-spark-1.1'
          - 'meta/muse-spark-1.2'
          - 'mindai/macaron-v1-tall'
          - 'mindai/macaron-v1-venti'
          - 'minimax/minimax-m2'
          - 'minimax/minimax-m2.1'
          - 'minimax/minimax-m2.5'
          - 'minimax/minimax-m2.5-lightning'
          - 'minimax/minimax-m2.7'
          - 'minimax/minimax-m2.7-highspeed'
          - 'minimax/minimax-m3'
