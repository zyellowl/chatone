version: 1.3.13
cache: true

interface:
  customWelcome: 'How can I help you today?'
  fileSearch: false
  modelSelect: true
  parameters: true
  presets: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: false
  agents:
    use: false
    create: false
    share: false
    public: false
  marketplace:
    use: false
  fileCitations: true
  defaultPinnedTools:
    - artifacts

modelSpecs:
  enforce: true
  prioritize: true
  list:
    # zenmux-favorites:start
    - name: chatgpt-subscription-gpt-5-6-sol
      label: 'GPT 5.6 Sol'
      description: 'Best overall capability'
      softDefault: true
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.6-sol'
        maxContextTokens: 244800
    - name: chatgpt-subscription-gpt-5-6-terra
      label: 'GPT 5.6 Terra'
      description: 'Balanced speed and reasoning'
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.6-terra'
        maxContextTokens: 244800
    - name: chatgpt-subscription-gpt-5-6-luna
      label: 'GPT 5.6 Luna'
      description: 'Fast and efficient'
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.6-luna'
        maxContextTokens: 244800
    - name: chatgpt-subscription-gpt-5-5
      label: 'GPT 5.5'
      description: 'Previous frontier model'
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.5'
        maxContextTokens: 244800
    - name: chatgpt-subscription-gpt-5-4
      label: 'GPT 5.4'
      description: 'Strong general reasoning'
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.4'
        maxContextTokens: 244800
    - name: chatgpt-subscription-gpt-5-4-mini
      label: 'GPT 5.4 mini'
      description: 'Fast everyday tasks'
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.4-mini'
        maxContextTokens: 244800
    - name: chatgpt-subscription-gpt-5-3-codex-spark
      label: 'GPT 5.3 Codex Spark'
      description: 'Fast coding tasks'
      showIconInMenu: false
      artifacts: true
      preset:
        endpoint: 'ChatGPT Subscription'
        model: 'gpt-5.3-codex-spark'
        maxContextTokens: 115200
    # zenmux-favorites:end

fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
    ZenMux:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
    ChatGPT Subscription:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
  clientImageResize:
    enabled: false

endpoints:
  all:
    streamRate: 8
    titleTiming: immediate
  custom:
    - name: ZenMux
      provider: anthropic
      apiKey: '${ZENMUX_API_KEY}'
      baseURL: '${ZENMUX_BASE_URL}'
      models:
        default:
          # zenmux-catalog:start
          - 'anthropic/claude-fable-5'
          - 'anthropic/claude-haiku-4.5'
          - 'anthropic/claude-opus-4'
          - 'anthropic/claude-opus-4.1'
          - 'anthropic/claude-opus-4.5'
          - 'anthropic/claude-opus-4.6'
          - 'anthropic/claude-opus-4.7'
          - 'anthropic/claude-opus-4.8'
          - 'anthropic/claude-opus-5'
          - 'anthropic/claude-sonnet-4'
          - 'anthropic/claude-sonnet-4.5'
          - 'anthropic/claude-sonnet-4.6'
          - 'anthropic/claude-sonnet-5'
          - 'baidu/ernie-5.0-thinking-preview'
          - 'baidu/ernie-5.1'
